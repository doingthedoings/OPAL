<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:1" /> <!-- Cyan -->
      <stop offset="50%" style="stop-color:#a855f7;stop-opacity:1" /> <!-- Purple -->
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" /> <!-- Pink -->
    </linearGradient>
    <linearGradient id="grad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.8" /> <!-- Blue -->
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0.8" /> <!-- Emerald -->
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Main Gem Shape -->
  <ellipse cx="256" cy="256" rx="160" ry="220" fill="url(#grad1)" />
  
  <!-- Facets (Low Poly overlay) -->
  <path d="M256 36 L360 180 L256 256 L152 180 Z" fill="white" fill-opacity="0.1" />
  <path d="M256 476 L360 332 L256 256 L152 332 Z" fill="black" fill-opacity="0.2" />
  <path d="M96 256 L152 180 L256 256 L152 332 Z" fill="url(#grad2)" />
  <path d="M416 256 L360 180 L256 256 L360 332 Z" fill="url(#grad2)" />
  
  <!-- Highlights -->
  <path d="M256 36 L152 180 L96 256 L152 332 L256 476 L360 332 L416 256 L360 180 Z" stroke="white" stroke-opacity="0.3" stroke-width="2" fill="none" />
  
  <!-- Shine -->
  <ellipse cx="200" cy="120" rx="40" ry="60" transform="rotate(-30 200 120)" fill="white" fill-opacity="0.2" />
</svg>
