    <title>OPAL</title>
    <link rel="icon" type="image/svg+xml" href="/opal-icon.svg" />
    <style>
      @keyframes holographic {
        0% { filter: hue-rotate(0deg) brightness(1) contrast(1); }
        50% { filter: hue-rotate(15deg) brightness(1.1) contrast(1.1); }
        100% { filter: hue-rotate(0deg) brightness(1) contrast(1); }
      }
      .opal-icon {
        animation: holographic 4s infinite ease-in-out;
      }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>

        background: #3f3f46; 
        border-radius: 4px;
